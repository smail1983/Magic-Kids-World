name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name magic_kids_world .

      - name: Configure Android build for flutter_tts
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.10"/' android/settings.gradle
          python3 - <<'PY'
          from pathlib import Path
          p = Path('android/app/build.gradle')
          s = p.read_text()
          s = s.replace('flutter.compileSdkVersion', '36')
          s = s.replace('lutter.compileSdkVersion', '36')
          s = s.replace('flutter.minSdkVersion', '21')
          s = s.replace('lutter.minSdkVersion', '21')
          p.write_text(s)
          PY

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-kids-world-apk
          path: build/app/outputs/flutter-apk/app-release.apk
