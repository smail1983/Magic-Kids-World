name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Generate Android project files
        run: flutter create --platforms=android --project-name magic_kids_world .

      - name: Configure Android build for flutter_tts
        run: |
          sed -i 's/id "org.jetbrains.kotlin.android" version "[^"]*"/id "org.jetbrains.kotlin.android" version "1.9.10"/' android/settings.gradle
          sed -i 's/compileSdk = [0-9]*/compileSdk = 36/' android/app/build.gradle
          sed -i 's/minSdk = [0-9]*/minSdk = 21/' android/app/build.gradle

      - name: Get dependencies
        run: flutter pub get

      - name: Analyze app
        run: flutter analyze lib

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-kids-world-apk
          path: build/app/outputs/flutter-apk/app-release.apk
